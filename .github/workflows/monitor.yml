name: Monitor Portal da Transparencia

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'

permissions:
  contents: write

jobs:
  executar-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar biblioteca requests
        run: pip install requests

      - name: Gerar dashboard atualizado
        run: python gerar_dashboard.py

      - name: Salvar dashboard no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "Sem alterações no dashboard" && exit 0
          git commit -m "Atualiza dashboard automaticamente"
          git push
